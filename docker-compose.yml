services:
  postgres:
    image: postgres:16
    container_name: codm-postgres
    restart: unless-stopped
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: codm
      POSTGRES_PASSWORD: codm
      POSTGRES_DB: codm
    volumes:
      - codm-postgres:/var/lib/postgresql/data

volumes:
  codm-postgres:
